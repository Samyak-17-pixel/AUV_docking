# Waypoint tracker - all tunable parameters live here.
# Frame: NED (x forward North, y East, z positive down). Actuator commands in sim units: th_XX = RPM, cs_XX = degrees (0 = stop/centred).
#
# REBUILT 2026-10-10 on common/ (see waypoint_tracking_core.py). The first version (fin PID in degrees with hard-coded `fin_yaw_signs`, an RPM surge with no speed
# loop, a depth PID in RPM) spun the vehicle after the first waypoint on the offline 20 kg model, because its fin signs [1, 1, -1, -1] are the opposite of the yaw mix the
# allocator derives from the vessel file (so the heading loop pushed the wrong way), its gain was not scheduled with speed, and nothing braked the coasting vehicle.
# The old `actuators:`, `heading:` (fin degrees), `surge:` (RPM) and `depth_pid:` (RPM) sections are gone; `gains:` (forces and moments, the same loops and numbers as
# station_keeping), `speed:` and `limits:` replace them. Get the old file with `git show HEAD:control_code/waypoint_tracking/waypoint_tracking.yaml`.
# NOT run on the real sim: yaw/fin signs and the thrust law are the same unverified assumptions as everywhere (docs/project_notes.md section 8); dof_testing yaw/heave steps check them.

node:
  name: waypoint_tracking
  vessel: Mako_01
  rate_hz: 20.0
  ros_domain_id: 42

topics:
  odometry: /Mako_01/odometry_sim          # nav_msgs/Odometry
  actuator_cmd: /Mako_01/actuator_cmd      # interfaces/Actuator

waypoints:
  # Mako starts at (0,0,3), heading north; the dock sits at (10,0,3) - stay short of it. z is the depth setpoint (m, + down) for the leg towards that waypoint.
  # The vehicle cannot strafe or pivot: its turning circle is ~2.5 m (speed.turn_radius_m), so a waypoint closer than that sideways from the line it arrives on is
  # UNREACHABLE (it orbits it). The old default (5 m x 3 m rectangle) was such a case: after the first corner the target was 3 m to the side, inside the circle.
  # A 5 m x 8 m rectangle is fine (offline: mission completes in ~70 s). The node warns at start-up about every corner it cannot make.
  - {x: 40.0, y: 0.0, z: 5.0}
  - {x: 40.0, y: 20.0, z: 10.0}
  - {x: 0.0, y: 20.0, z: 7.0}
  - {x: 0.0, y: 60.0, z: 2.0}
  - {x: 40.0, y: 60.0, z: 9.0}
  - {x: 40.0, y: 80.0, z: 4.0}
  - {x: 0.0, y: 80.0, z: 8.0}
  - {x: 0.0, y: 0.0, z: 3.0}
mission:
  acceptance_radius_m: 0.5   # a waypoint counts as reached inside this horizontal radius AND depth_acceptance_m. Smaller = more precise but the vehicle must slow and
                             #   turn more to hit it (it cannot strafe); 0.2 m is demanding, 1 m is easy. Analogy: the size of the goal mouth.
  depth_acceptance_m: 0.25   # used only when depth_gate is true
  depth_gate: false          # false (default since 2026-10-11) = a waypoint is reached on HORIZONTAL distance; the depth keeps settling on the way. true = also needs the depth within
                             #   depth_acceptance_m: with 4-8 m depth steps between waypoints the vehicle flew past the point, the gate stayed shut and it ORBITED the waypoint for ever.
  pass_radius_m: 3.0         # a waypoint also counts as reached when the vehicle is within this radius and the waypoint is now BEHIND it (more than 0.3 m past the beam; it cannot strafe or turn back inside the ~2.5 m
                             #   turning circle, so a 0.5 m acceptance alone is missed whenever the arrival is 0.5-3 m off the point). Smaller = stricter; 0 disables.
  hold_depth_m: 5.0          # depth used for a waypoint written without z
  loop: false                # true = go round the list for ever
  wait_for_odometry: true
  zero_on_exit: true         # publish neutral when the node exits

speed:
  cruise_mps: 1.5             # top speed between waypoints [m/s]. Fin authority and heading-loop quality grow with speed (MEASURED in station_keeping.yaml: a 30 deg
                             #   heading step settles in ~4 s at 0.8 m/s, 3 s at 1-1.5 m/s, and does not respond at all below ~0.15 m/s). Faster = shorter mission,
                             #   longer stopping distance (0.5 v^2 / decel_mps2) and bigger overshoot of a waypoint.
  flow_mps: 0.6              # lowest speed kept while moving between waypoints, and the speed used while turning a large angle. The X-fins need flow: 0.3 m/s gives
                             #   only 0.24 N*m of yaw, 0.5 gives 0.66, 1.0 gives 2.65. Too low = the vehicle cannot complete a turn; high = a wide turning circle.
  turn_radius_m: 2.5         # the smallest circle the vehicle can drive [m], MEASURED offline (orbiting an unreachable waypoint: diameter ~4.9 m). It does not depend on speed:
                             #   the fin moment and the hull's yaw drag both grow with speed^2. Used only for the start-up warning about unreachable corners; it is NOT a control
                             #   parameter. It grows with a lower fin_deg_cap (limits) and with a larger yaw inertia; re-measure on the real sim.
  decel_mps2: 0.3            # planned deceleration of the slow-down law v = sqrt(2 * decel * (distance - acceptance)). Keep it well below what the thruster can do
                             #   (limits: about 1 m/s^2 at 20 N) so the 0.2 s thruster lag and the 0.25 s late odometry do not make it overshoot the last waypoint.
  align_deg: 25.0            # heading error above which the speed target is exactly flow_mps (turn while moving, do not stop). Below it the speed is blended towards
                             #   zero with cos(error). 25 deg ~ 10% speed loss. Larger = keeps driving faster while still turning (wider arcs).

# GAINS. error = setpoint - measurement. Outputs: heave/speed in N, yaw in N*m. The D term uses the MEASURED rate. Same loops and numbers as station_keeping.yaml (documented
# there with the measured effect of each change); heave is the softer hold gain, yaw is the heading hold that settles a 30 deg step in ~4 s at 0.8 m/s.
gains:
  heave: {kp: 6.8, ki: 0.5, kd: 25.0, i_max: 10.0, max: 25.0, lpf_tau_s: 1.1, sp_tau_s: 3.0}      # N per m of depth error ... (see station_keeping.yaml)
  yaw:   {kp: 3.0, ki: 0.0001, kd: 3.6, i_max: 0.5, max: 3.0, lpf_tau_s: 0.2}                     # N*m per rad of heading error ...
  speed: {kp: 25.0, ki: 4.0, kd: 0.0, i_max: 15.0, max: 30.0, sp_tau_s: 1.5}                      # N per m/s of speed error; sp_tau_s smooths speed steps (no 50% overshoot)

feedforward:
  heave_n: 0.0               # N (+ = down) = the vehicle's net buoyancy. 0 for the current neutral 20 kg vessel file (see station_keeping.yaml).

limits:
  rpm_cap: 1800.0            # soft cap on every thruster [RPM] (hardware 2668)
  small_force_n: 0.3         # linear force-to-RPM map below this force (see station_keeping.yaml for the measured chatter reduction)
  fin_deg_cap: 25.0          # soft cap per fin [deg] (hardware +-35)
  u_fin_min_mps: 0.4         # speed floor of the 1/speed^2 fin gain schedule
  u_fin_off_mps: 0.15        # below this forward speed the fins are forced to zero
  u_fin_full_mps: 0.5        # above this the fins have full authority

estimator:                   # common/pose_filter.py: smooth, up-to-date state from the slow (4.5 Hz), late (0.25 s), noisy odometry; frozen odometry -> neutral
  filter: true
  odom_latency_s: 0.25
  accel_noise_lin: 0.25
  accel_noise_ang: 0.8
  pos_sigma_m: 0.015
  ang_sigma_rad: 0.0044

safety:
  min_depth_m: 0.4
  max_depth_m: 20.0
  max_pitch_deg: 60.0
  max_roll_deg: 60.0
  odom_timeout_s: 0.5

logging:
  status_period_s: 2.0
