# Waypoint tracker — all tunable parameters live here.
# Frame: NED (x forward North, y East, z positive down).
# Actuator commands in sim units: th_XX = RPM, cs_XX = degrees (0 = stop/centred).

node:
  name: waypoint_tracking
  rate_hz: 20.0
  ros_domain_id: 42

topics:
  odometry: /Mako_01/odometry_sim          # nav_msgs/Odometry
  actuator_cmd: /Mako_01/actuator_cmd      # interfaces/Actuator
  vessel_state: ""                         # e.g. /Mako_01/vessel_state

actuators:
  names:
    - th_02   # Heave_thruster_1 (forward)
    - th_03   # Heave_thruster_2 (aft)
    - th_01   # Axial_thruster (surge)
    - cs_04
    - cs_06
    - cs_07
    - cs_08
  heave_fwd: th_02
  heave_aft: th_03
  surge: th_01
  fins:
    - cs_04
    - cs_06
    - cs_07
    - cs_08
  # X-fin yaw mix signs (one per fin, same order as fins above)
  fin_yaw_signs: [1.0, 1.0, -1.0, -1.0]

waypoints:
  # Mako starts at (0,0,3); the dock sits at (10,0,3) — stay short of it.
  - {x: 5.0, y: 0.0, z: 3.0}
  - {x: 5.0, y: 3.0, z: 3.0}
  - {x: 0.0, y: 3.0, z: 3.0}
  - {x: 0.0, y: 0.0, z: 3.0}

mission:
  acceptance_radius_m: 0.5
  depth_acceptance_m: 0.25
  hold_depth_m: 5.0
  loop: false
  wait_for_odometry: true
  zero_on_exit: true

heading:
  # Output is signed fin deflection [deg] (yaw mix over the X-fins)
  kp: 0.8                 # deg fin per deg heading error
  ki: 0.02
  kd: 0.3
  i_max: 10.0             # integral clamp [deg]
  d_filter_tau_s: 0.05
  max_fin_delta_deg: 25.0 # |fin| max before soft cap
  align_deg: 25.0

surge:
  cruise_rpm: 800.0        # axial thruster RPM when heading is aligned
  scale_with_heading: true
  creep_rpm: 0.0
  rpm_min: 0.0
  rpm_max: 1000.0

depth_pid:
  # Output is signed heave thruster RPM
  kp: 300.0
  ki: 30.0
  kd: 150.0
  i_max: 500.0
  d_filter_tau_s: 0.05

limits:
  # Hardware limits from Mako_01.mavsim: thrusters ±2668 RPM, fins ±35 deg.
  rpm_max: 2668.0
  fin_deg_max: 35.0
  # Soft command caps (must be <= hardware limits)
  rpm_cap: 1000.0          # marginal: ~7 N total heave thrust at 1000 RPM vs +7.25 N net buoyancy (see station_keeping.yaml)
  fin_deg_cap: 25.0
  heave_sign: -1.0         # -1: heave thrusters point UP (positive RPM = up), a dive demand needs NEGATIVE RPM

logging:
  status_period_s: 2.0
