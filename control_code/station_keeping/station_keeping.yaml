# Station keeping (HOVER) for Mako_01 — every tunable value lives here.
#
# WHAT IT DOES
#   Captures the vehicle's pose when it starts (or uses explicit values) and then holds it:
#     depth    -> the two vertical heave thrusters push together          (works at any speed)
#     pitch    -> the same two thrusters push against each other          (works at any speed)
#     surge    -> the axial thruster goes forward/reverse to stay on its spot along the start heading
#     heading  -> the 4 X-fins steer the nose                             (ONLY works with water flowing over the fins)
#   WHAT IT CANNOT DO: there is no sideways thruster, so sideways (lateral) drift is NOT held — it is only
#   reported (lateral_drift_m in the log). And at zero speed the fins do nothing (see "fin" section), so a
#   hovering vehicle's heading will slowly wander unless something moves water past the fins.
#
# SIGN / UNIT CONVENTIONS
#   Depth is NED metres, + = deeper. Heave force Z is + = DOWN. Both heave thrusters point UP, so a
#   positive RPM pushes UP and a dive needs NEGATIVE RPM (the allocator handles this; you never set it here).
#   Forces in N, moments in N*m, angles in degrees in THIS file, angles in rad/s inside the loops.
#
# RE-MEASURED 2026-10-08 on the offline model of the CURRENT vessel ("Mako (1).mavsim": 20 kg, neutrally buoyant) with the gains
#   below: heave 1 m step 1.9% overshoot, 4.0 s settle | pitch 10 deg step 16% overshoot, 8.2 s | surge 1 m step 9.8%, slow tail
#   (30 s to settle within 5%) | heading 30 deg at 1 m/s 10.8%, 8.6 s. The per-parameter sweep numbers further down were measured on
#   the OLD 10 kg / +7.25 N model: trust their direction and relative size, not the exact values.
#
# HOW TO READ THE EFFECT NOTES (important)
#   The numbers like "overshoot 4.5%, settles in 6.5 s" were MEASURED on the OFFLINE vehicle model
#   (control_code/sim_offline) with this vehicle's mass/inertia/buoyancy from Mako_01.mavsim and ASSUMED
#   drag/thrust units. The real mavsim will differ: use the numbers for DIRECTION and RELATIVE SIZE
#   ("doubling kp roughly halves the overshoot"), not as promises. Retune on the real sim.
#   "Overshoot" = how far past the target it swings, as % of the move. "Settle" = time to stay within 5%
#   (10% for heading) of the target. Change ONE parameter at a time.
#   Recommended commissioning order: enable depth only -> add pitch -> add surge -> add heading.

node:
  name: station_keeping
  rate_hz: 20.0              # control loop rate. Analogy: how many times per second the driver looks at the road.
                             #   10 Hz still works (loops are slow, 1-5 s); below ~5 Hz the thruster lag (0.2 s)
                             #   starts to matter and the D-terms get coarse. 50 Hz+ gains nothing and just
                             #   amplifies sensor noise in the derivative. Keep 20.
  ros_domain_id: 42          # must match the mavsim bridge.
  vessel: Mako_01

topics:
  odometry: /Mako_01/odometry_sim      # nav_msgs/Odometry. Pose in NED. twist ASSUMED to be in the BODY frame.
  actuator_cmd: /Mako_01/actuator_cmd  # interfaces/Actuator (th_XX = RPM, cs_XX = degrees)

capture:
  mode: current              # current  = hold wherever the vehicle is when the node starts (after average_s).
                             # explicit = drive to / hold the numbers in `explicit` below.
  average_s: 2.0             # average this many seconds of odometry before latching the hold point.
                             #   Analogy: taking the average of several tape-measure readings instead of one.
                             #   Too short (<0.5 s) and one noisy sample or a wave bump becomes "the target";
                             #   too long (>5 s) and a vehicle that is already drifting gets a target
                             #   metres away from where you started the node.
  explicit:                  # used only when mode: explicit
    depth_m: 3.0             # NED depth to hold
    pitch_deg: 0.0           # + = nose up
    heading_deg: 0.0         # 0 = north, + = toward east
    north_m: 0.0             # position to hold, along the heading axis
    east_m: 0.0

enable:                      # switch loops on/off while commissioning. A disabled loop commands zero.
  depth: true                #   (When depth is off the buoyancy feed-forward below can still be applied.)
  pitch: true
  surge: true
  heading: true

# ---------------------------------------------------------------------------
# GAINS. error = setpoint - measurement. Output units: Z, X in N; pitch, yaw in N*m.
# The D term uses the MEASURED RATE (depth rate, pitch rate q, yaw rate r, surge speed) not the error
# derivative: no "kick" when you change a setpoint, and less noise. The vehicle has almost no natural
# damping (Z_w = M_q = K_p = 0 in the config) so kd is doing the job water normally does.
#   kp  = spring.      Analogy: a rubber band pulling to the target; stiffer band = harder pull per metre of error.
#   kd  = damper.      Analogy: a shock absorber / moving through honey; resists speed, stops the swinging.
#   ki  = patient helper. Analogy: someone leaning on the rope a bit more the longer the error persists;
#         removes the last stubborn offset (a steady current), but too much makes it wind up and overshoot.
#   i_max = how hard that helper is allowed to lean (the integral term's cap, in output units).
#   max   = cap on this loop's total output (N or N*m) before it goes to the allocator.
# ---------------------------------------------------------------------------
gains:
  # HEAVE, PITCH and YAW were RE-TUNED 2026-10-10 against the offline vehicle with REALISTIC odometry (4.5 Hz, 0.25 s late, 1.5 cm / 0.2 deg noise, freezes) and four plants
  # (nominal, heavy+late, light+fast, stress) by control_code/tuning/loop_tuner.py. The old values (heave 60/60, pitch 6/5) were measured on perfect 100 Hz data: with the
  # real sensing they chattered the thrusters by 2000 RPM peak-to-peak. The measured numbers below are for the NEW values (nominal plant, mean of 2 noise seeds).
  # The SURGE block further down is still the old measurement on the old model.
  heave:                   # depth hold -> Z force [N, + = down]
    kp: 6.8                  # N per metre of depth error. Stiffness. Analogy: a spring pulling the vehicle back to the depth; stiffer = faster but it rings, and the noise of the depth reading is multiplied by it.
                             #   MEASURED (0.4 m dive, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 61%, settle 37 s, thruster chatter 107 RPM
                             #     x0.75 -> overshoot 45%, settle 33 s, thruster chatter 103 RPM
                             #     x1 (this) -> overshoot 34%, settle 28 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 20%, settle 19 s, thruster chatter 115 RPM
                             #     x2.0 -> overshoot 10%, settle 7 s, thruster chatter 115 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    ki: 0.5                  # N per (unit*s). Integral. Only removes a steady push (a current, a trim error). Analogy: leaning on the rope a little longer each second you are still off target.
                             #   MEASURED (0.4 m dive, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 25%, settle 29 s, thruster chatter 95 RPM
                             #     x0.75 -> overshoot 30%, settle 29 s, thruster chatter 95 RPM
                             #     x1 (this) -> overshoot 34%, settle 28 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 41%, settle 40 s, thruster chatter 106 RPM
                             #     x2.0 -> overshoot 46%, settle 38 s, thruster chatter 131 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    kd: 25                   # N per unit/s of the rate. Damping on the depth RATE (the vehicle has almost no natural damping, so this is what stops the ringing). Analogy: the shock absorber.
                             #   MEASURED (0.4 m dive, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 40%, settle 37 s, thruster chatter 99 RPM
                             #     x0.75 -> overshoot 36%, settle 30 s, thruster chatter 101 RPM
                             #     x1 (this) -> overshoot 34%, settle 28 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 33%, settle 34 s, thruster chatter 129 RPM
                             #     x2.0 -> overshoot 32%, settle 38 s, thruster chatter 170 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    i_max: 10                # N. Cap on the integral part: big enough for a few-N steady push without a long wind-up.
    max: 25                  # Total heave force cap [N]; the two thrusters give about 23 N at 1800 RPM. Asking for more just saturates.
    lpf_tau_s: 1.1           # s. Time constant of a low-pass on the loop OUTPUT: keeps measurement noise from flicking the thrusters. Analogy: a heavy flywheel between the sensor and the thrusters.
                             #   MEASURED (0.4 m dive): x0.5 -> overshoot 32%, settle 29 s, thruster chatter 149 RPM | x0.75 -> overshoot 33%, settle 29 s, thruster chatter 114 RPM | x1 (this) -> overshoot 34%, settle 28 s, thruster chatter 97 RPM | x1.5 -> overshoot 36%, settle 27 s, thruster chatter 86 RPM | x2.0 -> overshoot 39%, settle 32 s, thruster chatter 85 RPM
    sp_tau_s: 3              # s. Time constant of a first-order filter on the SETPOINT: a step becomes a smooth ramp, so a big move does not overshoot. Starts from the measurement.
  pitch:                   # pitch hold -> M moment [N*m, + = nose up] by differential heave thrust
    kp: 1.925                # N*m per radian of pitch error. Stiffness of the pitch hold (no righting moment on this vehicle: CG == CB, so only this loop keeps it level). Analogy: balancing a plank on a pivot.
                             #   MEASURED (6 deg pitch step, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 20%, settle 24 s, thruster chatter 95 RPM
                             #     x0.75 -> overshoot 19%, settle 18 s, thruster chatter 95 RPM
                             #     x1 (this) -> overshoot 19%, settle 15 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 14%, settle 8 s, thruster chatter 101 RPM
                             #     x2.0 -> overshoot 15%, settle 14 s, thruster chatter 124 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    ki: 0.01                 # N*m per (unit*s). Integral; only for a steady pitching moment.
                             #   MEASURED (6 deg pitch step, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 18%, settle 15 s, thruster chatter 97 RPM
                             #     x0.75 -> overshoot 18%, settle 15 s, thruster chatter 97 RPM
                             #     x1 (this) -> overshoot 19%, settle 15 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 20%, settle 16 s, thruster chatter 97 RPM
                             #     x2.0 -> overshoot 21%, settle 20 s, thruster chatter 97 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    kd: 6                    # N*m per unit/s of the rate. Damping on the pitch rate. Never 0: with no natural damping the pitch keeps ringing.
                             #   MEASURED (6 deg pitch step, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 35%, settle 37 s, thruster chatter 99 RPM
                             #     x0.75 -> overshoot 26%, settle 27 s, thruster chatter 96 RPM
                             #     x1 (this) -> overshoot 19%, settle 15 s, thruster chatter 97 RPM
                             #     x1.5 -> overshoot 12%, settle 12 s, thruster chatter 134 RPM
                             #     x2.0 -> overshoot 7%, settle 14 s, thruster chatter 366 RPM
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    i_max: 1.5               # N*m. Cap on the integral part: big enough for a few-N steady push without a long wind-up.
    max: 4                   # Pitch moment cap [N*m]: about half what the two heave thrusters can make. Asking for more just saturates.
    lpf_tau_s: 0.36          # s. Output low-pass (noise filter), see heave.
                             #   MEASURED (6 deg pitch step): x0.5 -> overshoot 18%, settle 15 s, thruster chatter 119 RPM | x0.75 -> overshoot 19%, settle 15 s, thruster chatter 105 RPM | x1 (this) -> overshoot 19%, settle 15 s, thruster chatter 97 RPM | x1.5 -> overshoot 20%, settle 15 s, thruster chatter 98 RPM | x2.0 -> overshoot 21%, settle 19 s, thruster chatter 99 RPM
    sp_tau_s: 3              # s. Time constant of a first-order filter on the SETPOINT: a step becomes a smooth ramp, so a big move does not overshoot. Starts from the measurement.
  surge:                     # position hold along the start heading -> X force [N] on the axial thruster (+/- RPM)
    kp: 8.0                  # N per metre. MEASURED with a 4 N current pushing for 10 s: kp 2 -> drifts 0.92 m;
                             #   4 -> 0.67 m;  8 -> 0.42 m;  16 -> 0.24 m;  32 -> 0.15 m. (Peak excursion goes
                             #   about 1/sqrt(kp).) 1 m step: kp 8 -> 8.9% overshoot, 5.5 s; 16 -> 3%, 3 s.
                             #   Analogy: a boat tied to a buoy by a rubber rope — stiffer rope, less drift.
    ki: 0.3                  # N per (m*s). 0 -> no residual offset in our test but cannot beat a steady current;
                             #   1 -> 22% overshoot, 17.6 s; 3 -> 29%, 11 s. Keep small.
    kd: 25.0                 # N per (m/s). 0 -> 88% overshoot, never settles;  6 -> 37%;  12 -> 11%, 5.8 s;
                             #   25 -> 8.9%, 5.5 s;  50 -> 14%, 38 s (too heavy-handed).
    i_max: 4.0
    max: 20.0                # N. Thrust cap (axial thruster at ~1000 RPM gives ~7 N, 1800 RPM ~ 23 N).
  yaw:                     # heading hold -> N moment [N*m] via the fins. NEEDS FORWARD FLOW (see fin section).
    kp: 3                    # N*m per radian of heading error. Stiffness of the heading hold (needs fin flow: forward speed above ~0.4 m/s). Analogy: how hard the driver turns the wheel per degree of heading error.
                             #   MEASURED (30 deg heading step at 0.8 m/s, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 1%, settle 7 s, fin swing 1.2 deg
                             #     x0.75 -> overshoot 1%, settle 5 s, fin swing 1.4 deg
                             #     x1 (this) -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x1.5 -> overshoot 2%, settle 3 s, fin swing 2.3 deg
                             #     x2.0 -> overshoot 4%, settle 2 s, fin swing 3.6 deg
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    ki: 0.0001               # N*m per (unit*s). Integral; the vehicle has no steady yaw moment, keep it tiny.
                             #   MEASURED (30 deg heading step at 0.8 m/s, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x0.75 -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x1 (this) -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x1.5 -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x2.0 -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    kd: 3.6                  # N*m per unit/s of the rate. Damping on the yaw rate. Too much slows the turn; too little overshoots.
                             #   MEASURED (30 deg heading step at 0.8 m/s, nominal plant, 4.5 Hz odometry 0.25 s late with noise; 0.5x .. 2x of this value):
                             #     x0.5 -> overshoot 8%, settle 3 s, fin swing 1.2 deg
                             #     x0.75 -> overshoot 2%, settle 3 s, fin swing 1.4 deg
                             #     x1 (this) -> overshoot 1%, settle 4 s, fin swing 1.6 deg
                             #     x1.5 -> overshoot 2%, settle 5 s, fin swing 2.2 deg
                             #     x2.0 -> overshoot 1%, settle 6 s, fin swing 3.7 deg
                             #   A change of about 1.5x-2x is a considerable change. Checked on three more plants (heavy+late, light+fast, stress): the first two pass the same criteria; the stress plant stays stable but with more overshoot/chatter (see the header).
    i_max: 0.5               # N*m. Cap on the integral part: big enough for a few-N steady push without a long wind-up.
    max: 3                   # Yaw moment cap [N*m] (the fins give 0.7 N*m at 0.5 m/s and 2.7 at 1 m/s). Asking for more just saturates.
    lpf_tau_s: 0.2           # s. Output low-pass: smooths the fin command (fins at 1 m/s turn 1 deg of noise into several degrees of deflection).
                             #   MEASURED (30 deg heading step at 0.8 m/s): x0.5 -> overshoot 1%, settle 4 s, fin swing 1.9 deg | x0.75 -> overshoot 1%, settle 4 s, fin swing 1.8 deg | x1 (this) -> overshoot 1%, settle 4 s, fin swing 1.6 deg | x1.5 -> overshoot 2%, settle 4 s, fin swing 1.5 deg | x2.0 -> overshoot 2%, settle 3 s, fin swing 1.2 deg

feedforward:
  heave_n: 0.0               # N (+ = down) added to the depth loop's output = the vehicle's net buoyancy. 0 is right for the
                             #   current vessel file ("Mako (1).mavsim": mass 20 kg = buoyancy 20 kg, NEUTRALLY buoyant, and the live
                             #   sim coasted force-free). The old file had 10 / 10.74 kg => +7.25 N, which is why this used to be 7.25.
                             #   A WRONG value is not harmless: 7.25 N on a neutral 20 kg vehicle sinks it ~1 m in 5 s with the offline model's assumed drag, ~3 m with none.
                             #   Analogy: pressing the gas a little before a hill. No hill, no extra gas.
                             #   Re-measure if you change the vessel: let it hover with the depth loop and read the steady heave force
                             #   in the log (Z in the status line), then enter that value. Add payload/ballast -> change it.
                             #   (Measured on the old +7.25 N model: ff 0 -> sags 0.12 m; ff 7.25 -> 0 final error.)
  apply_when_depth_disabled: true   # keep pushing down by heave_n even if enable.depth is false (so the vehicle
                                    # does not just float away while you commission other loops).

# ---------------------------------------------------------------------------
deadband:                    # errors smaller than this are treated as zero (bigger ones are reduced by it, no jump).
                             # Analogy: a thermostat that ignores a 0.1 degree change instead of toggling the heater.
                             # Trades accuracy for quieter actuators. The offline model has no sensor noise, so only the
                             # accuracy cost shows there; the benefit appears on the real, noisy sensors.
  depth_m: 0.0               # MEASURED accuracy cost: 0.02 -> peak dev 0.053 m (vs 0.036 m);
                             #   0.05 -> 0.082 m;  0.15 -> 0.182 m, 10 cm left over. Rule: set to about 2x the
                             #   depth sensor noise (e.g. 0.02 for 1 cm noise), not more.
  pitch_deg: 0.0             # 1.0 would ignore wobbles under 1 deg. Raise if the thrusters keep twitching.
  surge_m: 0.0               # 0.05 = ignore 5 cm. Stops the axial thruster flipping between forward/reverse.
  heading_deg: 0.0           # 2.0 = ignore 2 deg heading error.

slew:                        # max rate of change of the ACTUAL command (0 = unlimited).
                             # Analogy: easing onto the gas pedal instead of stamping on it — protects motors/ESCs and
                             # avoids current spikes, but too gentle and the loop lags and swings.
  rpm_per_s: 0.0             # MEASURED (1 m dive): 300 -> 24% overshoot and not settled in 40 s (loop too slow);
                             #   1000 -> 3.6%, 6.2 s;  3000 -> 2.4%, 5 s;  0 -> 1.9%, 4.4 s. A full 0 -> 1800 RPM swing
                             #   should take no more than ~1-2 s, i.e. use >= 1000 if you set it at all.
  fin_deg_per_s: 0.0         # fins physically move at about 57 deg/s in the offline model (config deltad_max = 1.0).
                             #   Setting 30 smooths fin motion at the cost of heading response.

# ---------------------------------------------------------------------------
limits:
  rpm_cap: 1800.0            # soft cap on every thruster [RPM] (hardware limit 2668).
                             #   The two heave thrusters give about 23 N in total at 1800 RPM (about 7 N at 1000 RPM) under the
                             #   assumed thrust law. A neutral vehicle needs no trim force, so 1000 is enough for gentle moves, but a
                             #   disturbance of a few N needs more: MEASURED on the old +7.25 N model (6 N push): cap 800 drifts 5.4 m,
                             #   1000 -> 0.86 m, 1400 or more -> 0.098 m. Re-measure for the neutral 20 kg model if it matters.
                             #   Based on the ASSUMED thrust law (common/mako_geometry.yaml: rpm_to_rps). If the real
                             #   sim's thrust is weaker, depth hold will saturate: check the logs.
  small_force_n: 0.3         # [N] Below this thrust the force-to-RPM map is a straight line instead of a square root. Thrust grows with RPM squared, so the exact inverse (RPM ~ sqrt(force))
                             #   has an INFINITE slope at zero: a +-0.5 N flicker in the demand (sensor noise x gain) becomes a +-370 RPM flip of the propeller. With 0.3 N a flicker of
                             #   +-0.3 N is only +-110 RPM. MEASURED (heave/pitch hold, noisy odometry): 0 -> chatter 380-560 RPM peak-to-peak, 0.3 -> 100-250 RPM. The price: for a demand
                             #   below 0.3 N the thruster delivers a bit less than asked (F^2/0.3), which the feedback loops simply see as a softer gain near zero.
  fin_deg_cap: 25.0          # soft cap on each fin [deg] (hardware +-35). Lower it for gentler steering and to stay
                             #   out of fin stall; 25 keeps ~70% of the available force.
  # Fin gain scheduling. Fin force ~ speed^2, so the SAME deflection is 4x stronger at 1 m/s than at 0.5 m/s.
  # The allocator divides the demanded moment by speed^2 (with the floor below) so the loop gain stays about
  # constant, then fades the fins out near zero speed where they have no authority.
  # MEASURED 30 deg heading step: speed 0.15 m/s -> no response at all; 0.3 -> 14.7% overshoot, 12.6 s;
  # 0.5 -> 7.4%, 3.6 s;  1.0 -> 6.4%, 3.3 s;  1.5 -> 6.2%, 3.2 s.   => below ~0.3 m/s treat heading as NOT held.
  u_fin_min_mps: 0.4         # speed floor used in the 1/speed^2 division. Lower = bigger fin deflections for
                             #   the same moment at low speed (more authority but twitchier, can saturate);
                             #   higher = gentler/safer at low speed but weaker. Analogy: how much you'd
                             #   trust a rudder at walking pace — you'd rather not pull the tiller all the way over.
  u_fin_off_mps: 0.15        # below this forward speed the fin command is forced to zero. Raise to 0.3 to stop the
                             #   fins flapping in slack water.
  u_fin_full_mps: 0.5        # above this the fins have full authority; between off and full they fade in linearly.

# ---------------------------------------------------------------------------
safety:
  min_depth_m: 0.4           # abort + neutral if shallower (0 = surface; stops the vehicle broaching).
  max_depth_m: 20.0
  max_pitch_deg: 60.0        # abort beyond this pitch (no righting moment: a flipped vehicle stays flipped).
  max_roll_deg: 60.0
  max_drift_m: 5.0           # "leash": abort if the vehicle gets further than this from the hold point.
                             #   Sideways drift cannot be corrected, so in a real current this WILL trip eventually.
                             #   Analogy: the length of the rope on a boat tied to a buoy. Raise for longer tests.
  odom_timeout_s: 0.5        # no odometry for this long -> publish neutral (do not keep pushing blind).

logging:
  status_period_s: 2.0
  dir: logs/station_keeping   # one CSV per run

# ---------------------------------------------------------------------------
# STATE ESTIMATOR  (common/pose_filter.py): turns the slow, late, noisy odometry into a smooth state at the control rate
# ---------------------------------------------------------------------------
# The real sim's odometry arrives at ~4.5 Hz, ~0.25 s old, and (offline, with `fake_vehicle.py --realistic`) noisy. Feeding the loops the raw samples turns every sample's
# noise into a step in the command: 1.5 cm of depth noise times a gain of 60 N/m is a 0.9 N flick, which the thruster map turns into hundreds of RPM.
# The filter keeps a motion model in the loop (one small Kalman filter per axis) and predicts smoothly between samples. Analogy: reading a speedometer that only
# updates four times a second and is a quarter-second late: you do not jump at each new reading, you keep a running picture of where the car is.
# Measured offline (4.5 Hz, 0.25 s, 1.5 cm / 0.2 deg noise): depth RMS error 0.8 cm, forward speed 1.4 cm/s.
estimator:
  filter: true               # false = use the raw odometry like before (the old behaviour). Turn off only to compare.
  odom_latency_s: 0.25       # how old a sample is when it arrives (ASSUMED; measure it on the real sim by comparing a step of thrust with the first odometry reaction).
                             #   Too small: the vehicle is predicted slightly behind where it is -> more overshoot. Too large: predicted ahead -> a little chatter.
                             #   +-0.1 s changes the predicted position by v*0.1 (5 cm at 0.5 m/s); only matters for fast manoeuvres.
  accel_noise_lin: 0.25      # [m/s^2] how fast the vehicle may change speed (process noise). Higher = trusts new samples more (follows faster, noisier). 0.5 N-ish thrust / 20 kg = 0.5.
  accel_noise_ang: 0.8       # [rad/s^2] the same for roll/pitch/yaw.
  pos_sigma_m: 0.015         # assumed noise of a position sample. Higher = smoother and slower to react.
  ang_sigma_rad: 0.0044      # assumed noise of an angle sample (0.25 deg).
