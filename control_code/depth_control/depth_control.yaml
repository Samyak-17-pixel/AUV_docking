# Depth PID controller — all tunable parameters live here.
# Frame: NED (z positive down). The PID output is a 'dive demand' (+ = go deeper). The heave thrusters point UP
# (Mako_01.mavsim: orientation pitch=+90 deg), so positive RPM = UP and a dive needs NEGATIVE RPM -> limits.heave_sign = -1.
# Command units: th_XX = RPM, cs_XX = degrees (the bridge forwards them raw).

node:
  name: depth_control
  rate_hz: 20.0
  # Match mavsim bridge (default 42). Override with env ROS_DOMAIN_ID if set.
  ros_domain_id: 42

topics:
  odometry: /Mako_01/odometry_sim          # nav_msgs/Odometry
  actuator_cmd: /Mako_01/actuator_cmd      # interfaces/Actuator

actuators:
  # Names must match vessel config (th_XX / cs_XX).
  names:
    - th_02   # Heave_thruster_1 (forward)
    - th_03   # Heave_thruster_2 (aft)
    - th_01   # Axial_thruster (surge)
    - cs_04
    - cs_06
    - cs_07
    - cs_08
  heave_fwd: th_02
  heave_aft: th_03
  surge: th_01
  fins:
    - cs_04
    - cs_06
    - cs_07
    - cs_08

depth:
  # Desired absolute NED depth [m] (positive = deeper).
  setpoint_m: 10.0

pid:
  # Output is signed heave thruster RPM
  kp: 300.0         # RPM per metre of depth error
  ki: 30.0          # RPM per (m·s) integrated error
  kd: 150.0         # RPM per (m/s) depth-rate error
  i_max: 500.0      # integral clamp [RPM]
  d_filter_tau_s: 0.05

limits:
  # Sim units: th_XX = RPM, cs_XX = degrees. 0 = stop / centred.
  # Hardware limits from Mako_01.mavsim: thrusters ±2668 RPM, fins ±35 deg.
  rpm_max: 2668.0
  fin_deg_max: 35.0
  # Soft command caps (must be <= the hardware limits above)
  rpm_cap: 1000.0   # NOTE: marginal for this vehicle. Net buoyancy is +7.25 N and (assumed thrust law) both heave
                    # thrusters give only ~7 N at 1000 RPM, so there is almost no margin to dive. See station_keeping.yaml (1800).
  fin_deg_cap: 25.0
  # Hold surge / fins at zero while depth controlling
  surge_rpm: 0.0
  fin_deg: 0.0
  # -1.0 because both heave thrusters point UP: dive demand (+) must become NEGATIVE RPM.
  # (Was +1.0, which would have driven the vehicle UP whenever it needed to dive.)
  heave_sign: -1.0

behaviour:
  # Within this band counts as "at depth" [m]
  settle_tolerance_m: 0.2
  # Hold with PID for this long once inside the band, then neutral and exit [s]
  settle_time_s: 30.0
  wait_for_odometry: true
  # Publish neutral PWM on shutdown / Ctrl-C
  zero_on_exit: true

logging:
  status_period_s: 2.0
